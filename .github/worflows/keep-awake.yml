name: Keep Supabase awake

on:
  schedule:
    - cron: "0 8 */3 * *"   # tous les 3 jours à 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (3 tentatives)
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 30 \
            --retry 2 \
            --retry-delay 30 \
            --retry-all-errors \
            "https://poke-repertoire.vercel.app/api/pokemons"